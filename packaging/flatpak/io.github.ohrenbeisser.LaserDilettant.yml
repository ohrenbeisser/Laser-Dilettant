# Flatpak-Manifest (Qt 6.8 aus der KDE-Laufzeit). Lokal bauen:
#   flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build-dir packaging/flatpak/io.github.ohrenbeisser.LaserDilettant.yml
# Nicht lokal getestet: wird zuerst über GitHub Actions gebaut.
app-id: io.github.ohrenbeisser.LaserDilettant
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: laser-dilettant
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network      # ntfy und Fernansicht
  - --device=all         # USB-Anschluss des Lasers (/dev/ttyUSB0)
  - --filesystem=xdg-documents
modules:
  - name: laser-dilettant
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DLD_BUNDLE_QT=OFF
      - -DLD_BUILD_TESTS=OFF
    sources:
      - type: dir
        path: ../..
